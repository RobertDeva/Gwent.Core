name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build solution
        run: dotnet build Gwent.Core.sln --configuration Release
      - name: Run tests
        run: dotnet test Gwent.Core.sln --configuration Release --no-build
      - name: Run console smoke test
        run: dotnet run --project src/Gwent.Console --configuration Release --no-build
      - name: Run console DSL file smoke test
        run: dotnet run --project src/Gwent.Console --configuration Release --no-build -- examples/starter.gwent
